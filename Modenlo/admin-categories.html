<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - Modenlo Admin</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Header -->
        <header class="admin-header">
            <div class="header-content">
                <h1>📁 Manage Categories</h1>
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="admin-nav">
            <a href="admin.html">Frames</a>
            <a href="admin-mounts.html">Mounts</a>
            <a href="admin-categories.html" class="active">Categories</a>
            <a href="admin-orders.html">Orders</a>
        </nav>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Add Category Section -->
            <section class="admin-section">
                <h2>Add New Category</h2>
                <form id="addCategoryForm" class="admin-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="categoryName">Category Name *</label>
                            <input type="text" id="categoryName" required placeholder="e.g., Wall Displays">
                            <small>ID and link will be auto-generated from this</small>
                        </div>

                        <div class="form-group">
                            <label for="categoryId">Category ID (auto-generated) *</label>
                            <input type="text" id="categoryId" required placeholder="Auto-generated" readonly style="background-color: #f5f5f5; cursor: not-allowed;">
                            <small>Unique identifier (auto-generated)</small>
                        </div>

                        <div class="form-group">
                            <label for="categoryLink">Link URL (auto-generated) *</label>
                            <input type="text" id="categoryLink" required placeholder="Auto-generated" readonly style="background-color: #f5f5f5; cursor: not-allowed;">
                            <small>Auto-generated from category name</small>
                        </div>

                        <div class="form-group">
                            <label for="categoryPrice">Starting Price</label>
                            <input type="text" id="categoryPrice" placeholder="e.g., $15.99">
                        </div>

                        <div class="form-group">
                            <label for="categoryImage">Image Path *</label>
                            <input type="text" id="categoryImage" required placeholder="e.g., images/wall-display.jpg">
                        </div>

                        <div class="form-group">
                            <label for="categoryOrder">Display Order</label>
                            <input type="number" id="categoryOrder" placeholder="e.g., 1">
                            <small>Lower numbers appear first</small>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="categoryDescription">Description *</label>
                        <textarea id="categoryDescription" required rows="3" placeholder="Brief description of the category"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="categoryActive" checked>
                            <span>Active (visible on website)</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-primary">Add Category</button>
                </form>
            </section>

            <!-- Categories List Section -->
            <section class="admin-section">
                <div class="section-header">
                    <h2>Existing Categories</h2>
                    <span id="categoriesCount" class="count-badge">0</span>
                </div>

                <div id="categoriesTableContainer" class="table-container">
                    <div class="loading">Loading categories...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Category</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editCategoryForm" class="admin-form">
                <input type="hidden" id="editCategoryId">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="editCategoryName">Category Name *</label>
                        <input type="text" id="editCategoryName" required>
                    </div>

                    <div class="form-group">
                        <label for="editCategoryLink">Link URL *</label>
                        <input type="text" id="editCategoryLink" required>
                    </div>

                    <div class="form-group">
                        <label for="editCategoryPrice">Starting Price</label>
                        <input type="text" id="editCategoryPrice">
                    </div>

                    <div class="form-group">
                        <label for="editCategoryImage">Image Path *</label>
                        <input type="text" id="editCategoryImage" required>
                    </div>

                    <div class="form-group">
                        <label for="editCategoryOrder">Display Order</label>
                        <input type="number" id="editCategoryOrder">
                    </div>
                </div>

                <div class="form-group">
                    <label for="editCategoryDescription">Description *</label>
                    <textarea id="editCategoryDescription" required rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="editCategoryActive">
                        <span>Active (visible on website)</span>
                    </label>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin-categories-script.js"></script>
</body>
</html>
