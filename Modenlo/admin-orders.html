<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Management - Modenlo Admin</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>📦 Orders Management</h1>
            <div class="admin-nav">
                <a href="admin.html">Frame Management</a>
                <a href="admin-mounts.html">Mount Management</a>
                <a href="admin-categories.html">Categories</a>
                <a href="admin-clocks.html">Clocks</a>
                <a href="admin-orders.html" class="active">Orders</a>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </header>

        <div class="admin-content">
            <!-- Filters Section -->
            <div class="filters-section">
                <div class="filter-group">
                    <label>Status:</label>
                    <select id="statusFilter">
                        <option value="all">All Orders</option>
                        <option value="pending">Pending</option>
                        <option value="processing">Processing</option>
                        <option value="completed">Completed</option>
                        <option value="shipped">Shipped</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Search:</label>
                    <input type="text" id="searchInput" placeholder="Order ID, customer name, email...">
                </div>
                
                <button id="refreshBtn" class="btn-secondary">🔄 Refresh</button>
            </div>

            <!-- Orders Stats -->
            <div class="stats-section">
                <div class="stat-card">
                    <div class="stat-number" id="totalOrders">0</div>
                    <div class="stat-label">Total Orders</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pendingOrders">0</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="processingOrders">0</div>
                    <div class="stat-label">Processing</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedOrders">0</div>
                    <div class="stat-label">Completed</div>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="orders-section">
                <h2>Orders List</h2>
                <div id="ordersContainer">
                    <p class="loading-message">Loading orders...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content large">
            <span class="modal-close">&times;</span>
            <h2>Order Details</h2>
            <div id="orderDetails">
                <!-- Order details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="admin-orders-script.js"></script>
</body>
</html>
