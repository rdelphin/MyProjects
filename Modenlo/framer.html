<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Frame - Modenlo</title>
    <link rel="stylesheet" href="landing-style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="logo/logo_noSlogan.png" alt="Modenlo" class="logo-image">
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html#how-it-works">How It Works</a>
                <a href="index.html#categories">Shop</a>
                <a href="cart.html" class="cart-link">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="main-content">
            <!-- Two Column Layout -->
            <div class="framer-grid">
                <!-- Left Column - Image Upload/Preview -->
                <div class="upload-preview-col">
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="photoUpload" accept="image/*" hidden>
                        <label for="photoUpload" class="upload-dropzone">
                            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M7 18a4.6 4.4 0 0 1 0 -9a5 4.5 0 0 1 11 2h1a3.5 3.5 0 0 1 0 7h-1"></path>
                                <polyline points="9 15 12 12 15 15"></polyline>
                                <line x1="12" y1="12" x2="12" y2="21"></line>
                            </svg>
                            <span class="upload-text">Drag & Drop Image Here</span>
                            <span class="upload-or">OR</span>
                            <button type="button" class="choose-file-btn">Choose File</button>
                        </label>
                        <p class="upload-help">Select an image from your device. For best quality, please upload an image with the highest resolution (DPI) possible.</p>
                    </div>

                    <!-- Preview Canvas (Hidden Initially) -->
                    <div class="preview-area" id="previewArea" style="display: none;">
                        <div class="canvas-wrapper">
                            <canvas id="photoCanvas"></canvas>
                            <canvas id="cropOverlay"></canvas>
                        </div>
                        <button id="changeImageBtn" class="change-image-btn">Change Image</button>
                    </div>

                    <!-- Resolution Warning -->
                    <div class="resolution-warning" id="resolutionWarning" style="display: none;">
                        <div class="warning-icon">⚠️</div>
                        <div class="warning-content">
                            <strong>Image Resolution Warning</strong>
                            <p id="warningMessage"></p>
                        </div>
                        <button class="warning-close" id="closeWarning">&times;</button>
                    </div>
                </div>

                <!-- Right Column - Order Form -->
                <div class="order-form-col">
                    <h1 class="order-title">Order Your Frame</h1>
                    
                    <div class="price-cart-row">
                        <div class="price-display-main">
                            <span class="currency">$</span>
                            <span class="amount" id="totalPriceMain">29</span>
                            <span class="cents" id="totalCentsMain">99</span>
                        </div>
                        <button id="addToCartBtn" class="add-to-cart-main">ADD TO CART</button>
                    </div>

                    <div class="form-section">
                        <label class="form-label">PRINT SIZE</label>
                        <select id="frameSize" class="form-select">
                            <!-- Options will be populated from API -->
                        </select>
                    </div>

                    <div class="form-section">
                        <label class="form-label">ORIENTATION</label>
                        <select id="orientationSelect" class="form-select">
                            <option value="portrait">Portrait</option>
                            <option value="landscape">Landscape</option>
                        </select>
                    </div>

                    <div class="form-section">
                        <label class="form-label">
                            ZOOM
                            <span class="zoom-value" id="zoomValue">100%</span>
                        </label>
                        <input type="range" id="zoomSlider" class="zoom-slider" min="100" max="300" value="100" step="1">
                        <button id="resetPosition" class="reset-btn">Reset Position</button>
                    </div>

                    <div class="form-section">
                        <div class="mount-header">
                            <span class="mount-label">METAL MOUNT:</span>
                            <span class="mount-selected-name" id="mountSelectedName">No Mount</span>
                            <span class="mount-selected-price" id="mountSelectedPrice"></span>
                        </div>
                        <div class="mount-grid-cards" id="mountGrid">
                            <!-- Mount options will be populated dynamically -->
                        </div>
                    </div>

                    <button id="uploadNewBtn" class="upload-new-btn">Upload New Photo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <span id="toastMessage">✅ Item added to cart!</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
