<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Modenlo</title>
    <link rel="stylesheet" href="landing-style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart-style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="logo/logo_noSlogan.png" alt="Modenlo" class="logo-image">
                </a>
            </div>
            <div class="nav-links">
                <a href="how-it-works.html">How It Works</a>
                <a href="index.html#categories">Shop</a>
                <a href="cart.html" class="cart-link">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Shopping Cart</h1>
            <p>Review your items and proceed to checkout</p>
        </header>

        <div class="cart-content">
            <div class="back-link-container">
                <a href="index.html" class="back-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Continue Shopping
                </a>
            </div>

            <div class="cart-main">
                <!-- Cart Items Section -->
                <div class="cart-items-section">
                    <h2>Cart Items (<span id="itemCount">0</span>)</h2>
                    <div id="cartItemsContainer">
                        <!-- Cart items will be populated here -->
                    </div>
                    <div id="emptyCartMessage" style="display: none;">
                        <div class="empty-cart">
                            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            <h3>Your cart is empty</h3>
                            <p>Add some framed photos to get started!</p>
                            <a href="index.html" class="btn-primary">Start Framing</a>
                        </div>
                    </div>
                </div>

                <!-- Order Summary Section -->
                <div class="order-summary-section">
                    <div class="order-summary">
                        <h2>Order Summary</h2>
                        
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        
                        <div class="summary-row">
                            <span>Shipping:</span>
                            <span id="shipping">$0.00</span>
                        </div>
                        
                        <div class="summary-row">
                            <span>Tax (estimated):</span>
                            <span id="tax">$0.00</span>
                        </div>
                        
                        <div class="summary-divider"></div>
                        
                        <div class="summary-row total">
                            <span>Total:</span>
                            <span id="total">$0.00</span>
                        </div>
                        
                        <button id="checkoutBtn" class="btn-primary btn-block" disabled>
                            Proceed to Checkout
                        </button>
                        
                        <div class="payment-methods">
                            <p>We accept:</p>
                            <div class="payment-icons">
                                <span>💳</span>
                                <span>🏦</span>
                                <span>💰</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="cart-script.js"></script>
</body>
</html>
