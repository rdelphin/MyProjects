<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mount Management - Photo Framer Admin</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🖼️ Mount Management</h1>
            <div class="admin-nav">
                <a href="admin.html">Frame Management</a>
                <a href="admin-mounts.html" class="active">Mount Management</a>
                <a href="admin-orders.html">Orders</a>
            </div>
        </div>

        <div class="admin-content">
            <!-- Add New Mount Section -->
            <div class="add-frame-section">
                <h2>Add New Mount Option</h2>
                <form id="addMountForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newId">ID (e.g., wood-walnut):</label>
                            <input type="text" id="newId" required placeholder="wood-walnut">
                        </div>
                        <div class="form-group">
                            <label for="newName">Name:</label>
                            <input type="text" id="newName" required placeholder="Walnut Wood Mount">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="newDescription">Description:</label>
                        <input type="text" id="newDescription" placeholder="Rich walnut wood finish">
                    </div>
                    <div class="form-group">
                        <label for="newPrice">Price ($):</label>
                        <input type="number" id="newPrice" step="0.01" required placeholder="35.00">
                    </div>
                    <button type="submit" class="btn-primary">Add Mount Option</button>
                </form>
            </div>

            <!-- Mounts List Section -->
            <div class="frames-section">
                <h2>Current Mount Options</h2>
                <div class="frames-list" id="mountsList">
                    <p class="loading">Loading mounts...</p>
                </div>
            </div>
        <!-- Edit Modal -->
        <div class="modal" id="editModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Edit Mount</h2>
                    <button class="modal-close" id="closeModal">&times;</button>
                </div>
                <form id="editMountForm">
                    <input type="hidden" id="editMountId">
                    <div class="form-group">
                        <label for="editName">Name:</label>
                        <input type="text" id="editName" required>
                    </div>
                    <div class="form-group">
                        <label for="editDescription">Description:</label>
                        <input type="text" id="editDescription">
                    </div>
                    <div class="form-group">
                        <label for="editPrice">Price ($):</label>
                        <input type="number" id="editPrice" step="0.01" required>
                    </div>
                    <div class="modal-actions">
                        <button type="submit" class="btn-primary">Save Changes</button>
                        <button type="button" class="btn-secondary" id="cancelEdit">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Message Toast -->
        <div class="toast" id="toast"></div>
        </div>
    </div>

    <script src="admin-mounts-script.js"></script>
</body>
</html>
